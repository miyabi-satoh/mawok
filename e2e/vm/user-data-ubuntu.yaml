#cloud-config
# Ubuntu に GNOME の素の構成 (ubuntu-desktop-minimal) を入れ、mawok で自動ログインする。Linux の確認 (just linux-check-vm) を
# 中で回すための道具も入れる。Mawok は入れず、確かめるたびに linux-vm-run.mjs が今のビルドを写す
users:
  - name: mawok
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    lock_passwd: false
    plain_text_passwd: mawok
    ssh_authorized_keys:
      - '@SSH_KEY@'
ssh_pwauth: true
write_files:
  # ydotool のキーを送る常駐。uinput は root が要る。ソケットはログインした mawok の /run/user/1000 に置くので、ログインを待つ
  - path: /etc/systemd/system/ydotoold.service
    content: |
      [Unit]
      Description=ydotool daemon for the Mawok checks
      [Service]
      ExecStartPre=/bin/sh -c "until [ -d /run/user/1000 ]; do sleep 1; done"
      ExecStart=/usr/bin/ydotoold --socket-path=/run/user/1000/.ydotool_socket --socket-own=1000:1000
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=multi-user.target
# 1つのスクリプトにして、どれか1つでも失敗したら止める。最後まで通ったら MAWOK_VM_READY を出し、vm.sh はそれで出来上がりを見る
runcmd:
  - - bash
    - -euxc
    - |
      export DEBIAN_FRONTEND=noninteractive
      apt_get() { apt-get -o Acquire::Retries=5 -y "$@"; }
      apt_get update
      apt_get install wl-clipboard libwebkit2gtk-4.1-0 libayatana-appindicator3-1 python3-gi gir1.2-atspi-2.0 cmake build-essential
      # WebKitWebDriver のパッケージの名前は、26.04 で webkit2gtk-driver から変わった
      apt_get install webkitgtk-webdriver || apt_get install webkit2gtk-driver
      # ydotool は 24.04 の版 (0.1.8) が古く書き方も違うので、Aero と同じ 1.0.4 をソースから組む (マニュアルは組まない)
      curl -fsSL --retry 5 https://github.com/ReimuNotMoe/ydotool/archive/refs/tags/v1.0.4.tar.gz | tar -xz -C /tmp
      # 26.04 の cmake (4 系) は、ydotool の古い cmake_minimum_required を断るので、その下限で読ませる
      cmake -S /tmp/ydotool-1.0.4 -B /tmp/ydotool-1.0.4/build -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      make -C /tmp/ydotool-1.0.4/build -j4 ydotool ydotoold
      install -m755 /tmp/ydotool-1.0.4/build/ydotool /tmp/ydotool-1.0.4/build/ydotoold /usr/bin/
      systemctl enable ydotoold.service
      # Node は 24.04 の版 (18) が古いので、公式の配布物の LTS を置く
      V=$(curl -fsS --retry 5 https://nodejs.org/dist/index.json | python3 -c 'import json,sys; print([r["version"] for r in json.load(sys.stdin) if r["lts"]][0])')
      curl -fsS --retry 5 "https://nodejs.org/dist/$V/node-$V-linux-x64.tar.xz" | tar -xJ -C /opt
      ln -sf "/opt/node-$V-linux-x64/bin/node" /usr/local/bin/node
      curl -fsS --retry 5 -o /usr/local/bin/tauri-driver http://10.0.2.2:@HTTP_PORT@/tauri-driver
      chmod 755 /usr/local/bin/tauri-driver
      # デスクトップは最後に入れる。入れるとネットワークの管理が NetworkManager に移り、その間は外につながらないため
      apt_get install ubuntu-desktop-minimal
      printf '[daemon]\nAutomaticLoginEnable=true\nAutomaticLogin=mawok\n' > /etc/gdm3/custom.conf
      systemctl set-default graphical.target
      # GNOME の初回の案内 (Initial Setup) を出さない。確かめの窓の前に出て、フォーカスを取るため
      rm -f /etc/xdg/autostart/gnome-initial-setup-first-login.desktop
      echo MAWOK_VM_READY
power_state:
  mode: poweroff
  condition: true
