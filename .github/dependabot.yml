version: 2

# 各エコシステムの定期バージョン更新を、置き場所ごとに1本の PR にまとめる。個別の PR だと
# レビューの手間が依存の数だけ増えるため。間隔を monthly にしているのも同じ理由。
# まとめるのは minor / patch のみ。major は破壊的変更を含みうるので、個別の PR のままにする。
# security update は groups の対象外 (applies-to の既定値が version-updates のため) で、
# advisory を起点に依存ごとに PR が作られる。
updates:
  - package-ecosystem: 'cargo'
    directory: '/src-tauri'
    schedule:
      interval: 'monthly'
    # Tauri（wry・tao・notify-rust・tauri-plugin-single-instance）が使うのと同じ版に揃えている crate（scripts/check-pinned-deps.mjs の PINNED）。
    # Tauri より先に上げると型が合わなくなるか、2版入るので、Tauri が上がって scripts/check-pinned-deps.mjs が落ちたときに手で上げる。
    # 0.x の 0.38 → 0.39 は minor として扱われ、semver-major の指定では止まらないので、版を問わず外す
    ignore:
      - dependency-name: 'webview2-com'
      - dependency-name: 'windows-core'
      - dependency-name: 'tauri-winrt-notification'
      - dependency-name: 'webkit2gtk'
      - dependency-name: 'gtk'
      - dependency-name: 'zbus'
      # sha2 と hkdf は同じ digest の版で組む (src-tauri/src/sync_key.rs の Hkdf::<Sha256>)。片方だけ上がるとビルドが通らず、
      # sha2 を上げると Tauri (wry・tauri-codegen) の使う 0.10 と2版入る。Tauri が移ったら、2つを手で一緒に上げる
      - dependency-name: 'sha2'
      - dependency-name: 'hkdf'
    groups:
      cargo-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    # 型を、使っている Node の版に揃える
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/account-server'
    schedule:
      interval: 'monthly'
    groups:
      account-server-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/site'
    schedule:
      interval: 'monthly'
    groups:
      site-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/e2e'
    schedule:
      interval: 'monthly'
    groups:
      e2e-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns: ['*']
