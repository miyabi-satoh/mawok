[package]
name = "mawok"
version = "0.1.0"
edition = "2021"
# アプリなので crates.io には出さない。cargo-about もこれを見て、mawok 自身をライセンス表示から外す
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mawok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2.4.1"
# 文字列しか書かないので、画像を扱う既定の feature は要らない
arboard = { version = "3.6.1", default-features = false }
tauri-plugin-window-state = "2.5.0"
sys-locale = "0.3.2"
log = "0.4.34"
tauri-plugin-log = "2.10.1"
getrandom = "0.4.3"
# 設定のバックアップ・履歴・デバイスの設定の JSON
serde_json = "1.0.151"
# 置き換え辞書を、1つに見える文字（書記素）の途中で当てないため（text.rs）。Tauri の依存でもともと入っている
unicode-segmentation = "1.13.3"
# 定期の処理（毎日のバックアップ）と、ファイルの変化を落ち着かせてから読み直すのに使う。Tauri の依存でもともと入っている
tokio = { version = "1.53.1", features = ["time", "macros", "rt", "sync"] }
# 設定のファイルを、手で書いたコメントと並びを残して書き換える（settings_files.rs）
toml_edit = "0.25.15"
# 設定の置き場のファイルが、ほかのデバイスやエディターで変わったのを知る（settings_watch.rs）
notify = "8.2.1"
# 設定の置き場を選ぶフォルダーの窓（lib.rs の choose_settings_dir）
tauri-plugin-dialog = "2.8.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# デバッグ情報を行番号だけにして、target の肥大を抑える。
# バックトレースのファイル名と行番号は残るので、ログから追う分には困らない
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# トレイのメニューを開いている間を知るため（menu_tracking.rs）と、テキストウィンドウの見た目と Space の扱いを読み書きするため（focus.rs）、サンドボックスでフォルダーを読む許可をブックマークに残すため（folder_access.rs）。Tauri（tray-icon）が使うのと同じ版に揃える（scripts/check-pinned-deps.mjs が見る）
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSError", "NSNotification", "NSOperation", "NSString", "NSURL", "block2"] }
# メニューバーのアイコンのボタンに、押されたときの action を付ける（tray_press.rs）。tray-icon と同じ版にして、NSStatusItem を受け渡す
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSButton", "NSControl", "NSMenu", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
# ログイン時の起動を、ログイン項目（SMAppService）に登録する（autostart.rs）
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
# テキストウィンドウを、アプリを前面にしないパネルにする（focus.rs）
tauri-nspanel = "2.1.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# 多重起動を防ぐ。macOS は開き直しを OS が既存のインスタンスへ知らせるので、lib.rs の lock_single_instance で2つ目を止めるだけにする
tauri-plugin-single-instance = "2.5.4"

[target."cfg(windows)".dependencies]
# ログイン時の起動（autostart.rs）。macOS はログイン項目（SMAppService）、Linux は XDG autostart を直接使う
tauri-plugin-autostart = "2.7.0"
# ApplicationModel・Win32_Storage_Packaging_Appx は、MSIX 版かを見分けて（package.rs）、ログイン時の起動を StartupTask で行うため（autostart.rs）
windows = { version = "0.62.2", features = ["ApplicationModel", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_Packaging_Appx", "Win32_System_Recovery", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# WebView2 のイベントを受け取るため。Tauri（wry）が使うのと同じ版に揃える（scripts/check-pinned-deps.mjs が見る）
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
# WebView の描画プロセスが落ちたのを知る（diagnostics.rs）。Tauri（wry）が使うのと同じ版に揃える（scripts/check-pinned-deps.mjs が見る）
webkit2gtk = { version = "2.0.2", features = ["v2_20"] }
# `mawok --toggle` で呼んだデスクトップの印を窓に渡す（lib.rs の on_toggle）。Tauri（tao）が使うのと同じ版に揃える（scripts/check-pinned-deps.mjs が見る）
gtk = "0.18.2"
# `mawok --toggle` を、動いている Mawok に単一起動のプラグインと同じ D-Bus の呼び出しで渡す（toggle.rs）。プラグインが使うのと同じ版（scripts/check-pinned-deps.mjs が見る）
zbus = "5.19.0"
# Wayland のホットキーを、デスクトップの GlobalShortcuts portal に登録する（portal_hotkey.rs）。zbus は Tauri の側と同じく async-io で動かす
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3.34"
# Wayland では、クリップボードを XWayland 越しでなく Wayland の仕組み（data-control）で書く。持たないデスクトップ（GNOME）は X11 の道に落ちる
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
# 画面 (TS) に渡す型を Rust から書き出す。cargo test で src/lib/bindings/ に出力する
ts-rs = "12"
